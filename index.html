<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standing Broad Jump Helpline</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --bot-msg: #ffffff; --user-msg: #dbeafe; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        #chat-container { width: 100%; max-width: 500px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 90vh; overflow: hidden; border: 1px solid #e2e8f0; }
        #header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 85%; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
        .bot { background: var(--bot-msg); align-self: flex-start; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; }
        .user { background: var(--user-msg); align-self: flex-end; color: #1e40af; border-bottom-right-radius: 2px; }
        .video-link { display: block; margin-top: 8px; color: #2563eb; text-decoration: none; font-weight: bold; font-size: 13px; border-left: 2px solid #2563eb; padding-left: 8px; }
        #options { padding: 15px; border-top: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #fff; }
        button { padding: 10px 18px; border-radius: 25px; border: 1px solid var(--primary); background: white; color: var(--primary); cursor: pointer; font-weight: 500; transition: 0.2s; }
        button:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">Standing Broad Jump Helpline</div>
    <div id="messages"></div>
    <div id="options"></div>
</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const optionsDiv = document.getElementById('options');
    let currentGroup = "";

    const trainingData = {
        'Beginners': {
            intro: "Focus: Fundamentals & Landing. We need to make sure you aren't losing distance due to poor mechanics.",
            program: "Beginner Power Prep:\n1. Bodyweight Squats: 3x15\n2. Calf Raises: 3x20\n3. Glute Bridges: 3x12\n4. Plank: 3x30s\n5. Arm Swing Drills: 3x10",
            videos: [
                { title: "1. Bodyweight Squat Form", url: "https://www.youtube.com/watch?v=n_xLyzPEX7A" },
                { title: "2. Calf Raise Technique", url: "https://www.youtube.com/watch?v=_OewEscCsbo" },
                { title: "3. Glute Bridge Tutorial", url: "https://www.youtube.com/watch?v=R6n608M3czU" },
                { title: "4. Perfect Plank Form", url: "https://www.youtube.com/watch?v=v25dawSzRTM" },
                { title: "5. Jump Arm Swing Drill", url: "https://www.youtube.com/watch?v=Na73NSq2YdQ" }
            ]
        },
        'Developing': {
            intro: "Focus: Explosive Extension. You have the basics; now we need more force from your hips.",
            program: "Developing Explosiveness:\n1. Jump Squats: 4x8\n2. Alternating Lunges: 3x10/leg\n3. Tuck Jumps: 3x6\n4. Superman: 3x12\n5. Broad Jump Technique: 4x5",
            videos: [
                { title: "1. Jump Squat Guide", url: "https://www.youtube.com/watch?v=h5TmdMMtIT4" },
                { title: "2. Lunge Technique", url: "https://www.youtube.com/watch?v=1cS-6KsJW9g" },
                { title: "3. Tuck Jump Tutorial", url: "https://www.youtube.com/watch?v=4hXaSh2WlyE" },
                { title: "4. Superman Form", url: "https://www.youtube.com/watch?v=z6PJMT2y8GQ" },
                { title: "5. Broad Jump Landing Tip", url: "https://www.youtube.com/watch?v=dVgtvAXeBQw" }
            ]
        },
        'Competent': {
            intro: "Focus: Rate of Force Development. We are looking for elite power and optimization.",
            program: "Elite SBJ Optimization:\n1. Depth Jumps: 4x5\n2. Single Leg Box Jumps: 3x4/leg\n3. Burpees (Max Speed): 3x10\n4. L-Sits or Leg Raises: 3x10\n5. Max Effort Broad Jumps: 5x3",
            videos: [
                { title: "1. Depth Jumps Tutorial", url: "https://www.youtube.com/watch?v=V2e-wz6AIhk" },
                { title: "2. Single Leg Box Jumps", url: "https://www.youtube.com/watch?v=C5uWN9FIU9E" },
                { title: "3. Speed Burpee Form", url: "https://www.youtube.com/watch?v=OlgGRqUkv3w" },
                { title: "4. L-Sit / Leg Raise Core Tech", url: "https://www.youtube.com/watch?v=xe2MXatLTUw" },
                { title: "5. Max Effort Broad Jump Breakdown", url: "https://www.youtube.com/watch?v=gJTPHXgB5MY" }
            ]
        }
    };

    function addMessage(text, type, links = []) {
        const msg = document.createElement('div');
        msg.className = `msg ${type}`;
        msg.innerText = text;
        
        links.forEach(link => {
            const a = document.createElement('a');
            a.className = 'video-link';
            a.href = link.url;
            a.target = '_blank';
            a.innerText = `▶ ${link.title}`;
            msg.appendChild(a);
        });

        messagesDiv.appendChild(msg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showOptions(options) {
        optionsDiv.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => handleChoice(opt);
            optionsDiv.appendChild(btn);
        });
    }

    function handleChoice(choice) {
        addMessage(choice, 'user');

        setTimeout(() => {
            if (trainingData[choice]) {
                currentGroup = choice;
                addMessage(trainingData[choice].intro, 'bot');
                setTimeout(() => {
                    addMessage("Would you like a bodyweight exercise program to help you improve?", "bot");
                    showOptions(["Show Program", "Back"]);
                }, 600);
            } 
            else if (choice === "Show Program") {
                addMessage(trainingData[currentGroup].program, "bot");
                setTimeout(() => {
                    addMessage("Would you like video examples for these exercises?", "bot");
                    showOptions(["Yes, show videos", "No, thanks"]);
                }, 600);
            }
            else if (choice === "Yes, show videos") {
                addMessage("Watch these for proper form:", "bot", trainingData[currentGroup].videos);
                showOptions(["Reset"]);
            }
            else if (choice === "Back" || choice === "No, thanks" || choice === "Reset") {
                init();
            }
        }, 500);
    }

    function init() {
        messagesDiv.innerHTML = '';
        addMessage("Welcome to the SBJ Helpline. Which group best describes your current performance?", "bot");
        showOptions(["Beginners", "Developing", "Competent"]);
    }

    init();
</script>

</body>
</html>
