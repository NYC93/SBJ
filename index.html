<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standing Broad Jump Tracker</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
        }
        /* Hide the video element, we will draw it onto the canvas */
        .input_video {
            display: none; 
        }
        .output_canvas {
            width: 100%;
            height: auto;
            border-bottom: 3px solid #333;
        }
        #ui-panel {
            padding: 15px;
            text-align: center;
            width: 100%;
        }
        .metric {
            font-size: 1.5rem;
            margin: 5px 0;
        }
        .record {
            font-size: 2rem;
            color: #ff4757;
            font-weight: bold;
        }
        button {
            padding: 12px 24px;
            font-size: 1.2rem;
            background-color: #1e90ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            background-color: #0984e3;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video class="input_video" autoplay playsinline></video>
        <canvas class="output_canvas" width="1280" height="720"></canvas>
        <div id="loading">Loading Camera & AI...</div>
    </div>

    <div id="ui-panel">
        <div class="metric">Current Jump: <span id="current-jump">0.00</span> m</div>
        <div class="metric record">RECORD: <span id="max-jump">0.00</span> m</div>
        <button onclick="resetRecord()">Reset for Next Student</button>
    </div>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const loadingElement = document.getElementById('loading');
        
        let maxJumpDistance = 0.0;

        // --- CALIBRATION SETTINGS ---
        // Assuming the student jumps from LEFT to RIGHT across the screen.
        const START_LINE_PERCENT = 0.15; // Start line is at 15% of the screen width
        const PIXELS_PER_METER = 350;    // Adjust this based on your camera's field of view
        
        function resetRecord() {
            maxJumpDistance = 0.0;
            document.getElementById('max-jump').innerText = "0.00";
        }

        function onResults(results) {
            // Hide loading screen once AI is running
            loadingElement.style.display = 'none';

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Draw Video Frame
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            const startLineX = canvasElement.width * START_LINE_PERCENT;

            // Draw Virtual Cones/Lines (0m, 1m, 2m, 3m)
            for (let i = 0; i <= 3; i++) {
                let lineX = startLineX + (i * PIXELS_PER_METER);
                
                // Draw Line
                canvasCtx.beginPath();
                canvasCtx.moveTo(lineX, 0);
                canvasCtx.lineTo(lineX, canvasElement.height);
                canvasCtx.strokeStyle = i === 0 ? '#00ff00' : '#ffa500'; // Green for start, Orange for meters
                canvasCtx.lineWidth = 4;
                canvasCtx.stroke();
                
                // Draw Text
                canvasCtx.font = "30px Arial";
                canvasCtx.fillStyle = "white";
                canvasCtx.fillText(i + "m", lineX + 10, canvasElement.height - 20);
            }

            // Pose Tracking Logic
            if (results.poseLandmarks) {
                // Draw Skeleton
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 2});

                // Get Heels (MediaPipe indices: 29 = Left Heel, 30 = Right Heel)
                const leftHeel = results.poseLandmarks[29];
                const rightHeel = results.poseLandmarks[30];

                // Convert normalized coordinates (0-1) to canvas pixels
                const leftHeelX = leftHeel.x * canvasElement.width;
                const rightHeelX = rightHeel.x * canvasElement.width;

                // Find the back-most foot (minimum X value since they are jumping left to right)
                const backHeelX = Math.min(leftHeelX, rightHeelX);

                // Calculate Distance
                const distancePixels = backHeelX - startLineX;
                
                if (distancePixels > 0) {
                    const currentDistanceMeters = distancePixels / PIXELS_PER_METER;
                    
                    // Update UI
                    document.getElementById('current-jump').innerText = currentDistanceMeters.toFixed(2);

                    if (currentDistanceMeters > maxJumpDistance) {
                        maxJumpDistance = currentDistanceMeters;
                        document.getElementById('max-jump').innerText = maxJumpDistance.toFixed(2);
                    }
                }
            }
            canvasCtx.restore();
        }

        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});
        
        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({image: videoElement});
            },
            width: 1280,
            height: 720,
            facingMode: "environment" // Uses the back camera on mobile phones
        });
        
        camera.start();
    </script>
</body>
</html>
