<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBJ Helpline - Persistent Data</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --bot-msg: #ffffff; --user-msg: #dbeafe; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        #chat-container { width: 100%; max-width: 500px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 90vh; overflow: hidden; border: 1px solid #e2e8f0; }
        
        /* ADMIN HACK: Click the header to download */
        #header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; cursor: pointer; user-select: none; }
        #header:active { opacity: 0.8; }

        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 85%; line-height: 1.5; font-size: 14px; }
        .bot { background: var(--bot-msg); align-self: flex-start; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; }
        .user { background: var(--user-msg); align-self: flex-end; color: #1e40af; border-bottom-right-radius: 2px; }
        
        .enquiry-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .enquiry-form input, .enquiry-form textarea { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        #options { padding: 15px; border-top: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #fff; }
        button { padding: 10px 18px; border-radius: 25px; border: 1px solid var(--primary); background: white; color: var(--primary); cursor: pointer; font-weight: 500; transition: 0.2s; }
        button:hover { background: var(--primary); color: white; }
        .video-link { display: block; margin-top: 8px; color: #2563eb; text-decoration: none; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header" onclick="adminAccess()">Standing Broad Jump Helpline</div>
    <div id="messages"></div>
    <div id="options"></div>
</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const optionsDiv = document.getElementById('options');
    let currentGroup = "";

    // PERMANENT STORAGE LOGIC
    // This loads existing data from the browser's memory on startup
    let submissions = JSON.parse(localStorage.getItem('sbj_enquiries')) || [];

    const trainingData = {
        'Beginners': {
            intro: "Focus: Fundamentals.",
            program: "Beginner Prep:\n1. Squats 3x15\n2. Calf Raises 3x20\n3. Bridges 3x12\n4. Plank 30s\n5. Arm Swings",
            videos: [{title: "Basic Drills", url: "https://youtu.be/Na73NSq2YdQ"}]
        },
        'Developing': {
            intro: "Focus: Explosiveness.",
            program: "Developing:\n1. Jump Squats 4x8\n2. Lunges 3x10\n3. Tuck Jumps 3x6\n4. Superman 3x12\n5. Technique 4x5",
            videos: [{title: "Power Technique", url: "https://youtu.be/dVgtvAXeBQw"}]
        },
        'Competent': {
            intro: "Focus: Force Development.",
            program: "Elite:\n1. Depth Jumps 4x5\n2. SL Box Jumps 3x4\n3. Burpees 3x10\n4. L-Sits 3x10\n5. Max Effort 5x3",
            videos: [
                {title: "Depth Jumps", url: "https://youtu.be/V2e-wz6AIhk"},
                {title: "Elite Breakdown", url: "https://youtu.be/gJTPHXgB5MY"}
            ]
        }
    };

    function addMessage(text, type, links = [], isForm = false) {
        const msg = document.createElement('div');
        msg.className = `msg ${type}`;
        msg.innerText = text;
        links.forEach(link => {
            const a = document.createElement('a');
            a.className = 'video-link'; a.href = link.url; a.target = '_blank';
            a.innerText = `▶ ${link.title}`;
            msg.appendChild(a);
        });
        if (isForm) {
            msg.innerHTML += `
                <div class="enquiry-form">
                    <input type="text" id="f-name" placeholder="Name">
                    <input type="text" id="f-class" placeholder="Class">
                    <textarea id="f-query" rows="2" placeholder="Enquiry"></textarea>
                    <input type="text" id="f-teacher" placeholder="PE Teacher">
                    <button class="submit-btn" onclick="saveEnquiry()">Submit</button>
                </div>`;
        }
        messagesDiv.appendChild(msg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showOptions(opts) {
        optionsDiv.innerHTML = '';
        opts.forEach(o => {
            const b = document.createElement('button');
            b.innerText = o; b.onclick = () => handleChoice(o);
            optionsDiv.appendChild(b);
        });
    }

    function handleChoice(c) {
        addMessage(c, 'user');
        setTimeout(() => {
            if (trainingData[c]) {
                currentGroup = c;
                addMessage(trainingData[c].intro, 'bot');
                showOptions(["Show Program", "Back"]);
            } else if (c === "Show Program") {
                addMessage(trainingData[currentGroup].program, "bot");
                showOptions(["Yes, show videos", "Skip"]);
            } else if (c === "Yes, show videos" || c === "Skip") {
                if (c.includes("Yes")) addMessage("Watch these:", "bot", trainingData[currentGroup].videos);
                addMessage("Do you need additional help?", "bot");
                showOptions(["Yes, enquiry", "No, thanks"]);
            } else if (c === "Yes, enquiry") {
                addMessage("Fill this in:", "bot", [], true);
                optionsDiv.innerHTML = '';
            } else if (c === "No, thanks" || c === "Reset" || c === "Back") { init(); }
        }, 500);
    }

    window.saveEnquiry = function() {
        const entry = {
            Time: new Date().toLocaleString(),
            Name: document.getElementById('f-name').value,
            Class: document.getElementById('f-class').value,
            Query: document.getElementById('f-query').value,
            Teacher: document.getElementById('f-teacher').value
        };
        if(!entry.Name || !entry.Query) return alert("Missing info!");
        
        // ADD TO LIST AND SAVE TO PERMANENT STORAGE
        submissions.push(entry);
        localStorage.setItem('sbj_enquiries', JSON.stringify(submissions));
        
        addMessage("Saved! Your teacher can now access this.", "bot");
        setTimeout(() => { addMessage("Thank you!", "bot"); showOptions(["Reset"]); }, 800);
    };

    // ADMIN DOWNLOAD FUNCTION
    window.adminAccess = function() {
        const pass = prompt("Admin Password:");
        if (pass !== "PE2026") return alert("Denied");
        
        if (submissions.length === 0) return alert("Database is empty.");

        // Convert JSON to CSV for Excel
        let csv = "Time,Name,Class,Enquiry,Teacher\n" + 
            submissions.map(s => `"${s.Time}","${s.Name}","${s.Class}","${s.Query}","${s.Teacher}"`).join("\n");

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SBJ_Data_Export.csv`;
        a.click();
    };

    function init() {
        messagesDiv.innerHTML = '';
        addMessage("Welcome! Select your level:", "bot");
        showOptions(["Beginners", "Developing", "Competent"]);
    }
    init();
</script>
</body>
</html>
