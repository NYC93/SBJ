<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standing Broad Jump Helpline</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --bot-msg: #ffffff;
            --user-msg: #dbeafe;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        #chat-container { width: 100%; max-width: 500px; background: white; border-radius: 12px; shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; overflow: hidden; border: 1px solid #e2e8f0; }
        #header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 15px; }
        .bot { background: var(--bot-msg); align-self: flex-start; border: 1px solid #e2e8f0; }
        .user { background: var(--user-msg); align-self: flex-end; color: #1e40af; }
        #options { padding: 15px; border-top: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        button { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--primary); background: white; color: var(--primary); cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">Standing Broad Jump Helpline</div>
    <div id="messages" id="chat-box"></div>
    <div id="options" id="button-container"></div>
</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const optionsDiv = document.getElementById('options');

    const trainingData = {
        'Beginners': {
            text: "Focus: Mechanics & Landing. Most beginners lose distance by falling backward or having 'heavy' feet. Work on: \n1. Arm Swing: Drive arms back hard before jumping.\n2. Landing: Practice landing on mid-foot and reaching forward.\n3. Squat Depth: Don't dip too low; a half-squat creates the most power.",
            next: ["Developing", "Competent", "Start Over"]
        },
        'Developing': {
            text: "Focus: Explosive Power. You have the form, now you need the 'pop'. Work on:\n1. Tuck Jumps: Pull knees to chest to increase air time.\n2. Weighted Squats: Build the raw leg strength.\n3. Extension: Ensure your hips are fully locked out (straight) at the moment of take-off.",
            next: ["Competent", "Beginners", "Start Over"]
        },
        'Competent': {
            text: "Focus: Optimization & Elasticity. You're fighting for centimeters. Work on:\n1. Depth Jumps: Drop from a box and immediately jump forward to train the nervous system.\n2. Core Tension: A tight core prevents energy leaks mid-air.\n3. The Reach: Practice 'throwing' your feet forward at the last second and swinging arms back for counter-balance.",
            next: ["Beginners", "Developing", "Start Over"]
        }
    };

    function addMessage(text, type) {
        const msg = document.createElement('div');
        msg.className = `msg ${type}`;
        msg.innerText = text;
        messagesDiv.appendChild(msg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showOptions(options) {
        optionsDiv.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => handleChoice(opt);
            optionsDiv.appendChild(btn);
        });
    }

    function handleChoice(choice) {
        if (choice === "Start Over") {
            init();
            return;
        }
        addMessage(choice, 'user');
        setTimeout(() => {
            const data = trainingData[choice];
            addMessage(data.text, 'bot');
            showOptions(data.next);
        }, 500);
    }

    function init() {
        messagesDiv.innerHTML = '';
        addMessage("Welcome to the SBJ Helpline. Which group best describes your current performance?", "bot");
        showOptions(["Beginners", "Developing", "Competent"]);
    }

    init();
</script>

</body>
</html>
