<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBJ Helpline & Admin Portal</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --bot-msg: #ffffff; --user-msg: #dbeafe; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        #chat-container { width: 100%; max-width: 500px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; overflow: hidden; border: 1px solid #e2e8f0; }
        #header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; position: relative; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 85%; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
        .bot { background: var(--bot-msg); align-self: flex-start; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; }
        .user { background: var(--user-msg); align-self: flex-end; color: #1e40af; border-bottom-right-radius: 2px; }
        .video-link { display: block; margin-top: 8px; color: #2563eb; text-decoration: none; font-weight: bold; font-size: 13px; border-left: 2px solid #2563eb; padding-left: 8px; }
        
        /* Form & Admin Styling */
        .enquiry-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; width: 100%; }
        .enquiry-form input, .enquiry-form textarea { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; font-family: inherit; }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #admin-btn { margin-top: 15px; font-size: 11px; color: #94a3b8; cursor: pointer; text-decoration: underline; background: none; border: none; }

        #options { padding: 15px; border-top: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #fff; }
        button { padding: 10px 18px; border-radius: 25px; border: 1px solid var(--primary); background: white; color: var(--primary); cursor: pointer; font-weight: 500; transition: 0.2s; }
        button:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">Standing Broad Jump Helpline</div>
    <div id="messages"></div>
    <div id="options"></div>
</div>

<button id="admin-btn" onclick="downloadData()">Admin Download (Password Required)</button>

<script>
    const messagesDiv = document.getElementById('messages');
    const optionsDiv = document.getElementById('options');
    let currentGroup = "";
    let submissions = []; // Stores the enquiry data for Excel

    const trainingData = {
        'Beginners': {
            intro: "Focus: Fundamentals & Landing.",
            program: "Beginner Power Prep:\n1. Bodyweight Squats: 3x15\n2. Calf Raises: 3x20\n3. Glute Bridges: 3x12\n4. Plank: 3x30s\n5. Arm Swing Drills: 3x10",
            videos: [{ title: "Form Tutorials", url: "https://www.youtube.com/results?search_query=standing+broad+jump+beginner+drills" }]
        },
        'Developing': {
            intro: "Focus: Explosive Extension.",
            program: "Developing Explosiveness:\n1. Jump Squats: 4x8\n2. Alternating Lunges: 3x10/leg\n3. Tuck Jumps: 3x6\n4. Superman: 3x12\n5. Broad Jump Technique: 4x5",
            videos: [{ title: "Power Drills", url: "https://www.youtube.com/results?search_query=standing+broad+jump+power+exercises" }]
        },
        'Competent': {
            intro: "Focus: Rate of Force Development.",
            program: "Elite SBJ Optimization:\n1. Depth Jumps: 4x5\n2. Single Leg Box Jumps: 3x4/leg\n3. Burpees (Max Speed): 3x10\n4. L-Sits: 3x10\n5. Max Effort Broad Jumps: 5x3",
            videos: [
                { title: "1. Depth Jumps", url: "https://www.youtube.com/watch?v=V2e-wz6AIhk" },
                { title: "2. Single Leg Box Jumps", url: "https://www.youtube.com/watch?v=C5uWN9FIU9E" },
                { title: "3. Speed Burpees", url: "https://www.youtube.com/watch?v=OlgGRqUkv3w" },
                { title: "4. Core Tech", url: "https://www.youtube.com/watch?v=xe2MXatLTUw" },
                { title: "5. Elite Jump Breakdown", url: "https://www.youtube.com/watch?v=gJTPHXgB5MY" }
            ]
        }
    };

    function addMessage(text, type, links = [], isForm = false) {
        const msg = document.createElement('div');
        msg.className = `msg ${type}`;
        msg.innerText = text;
        
        links.forEach(link => {
            const a = document.createElement('a');
            a.className = 'video-link'; a.href = link.url; a.target = '_blank';
            a.innerText = `▶ ${link.title}`;
            msg.appendChild(a);
        });

        if (isForm) {
            const form = document.createElement('div');
            form.className = 'enquiry-form';
            form.innerHTML = `
                <input type="text" id="form-name" placeholder="Name">
                <input type="text" id="form-class" placeholder="Class">
                <textarea id="form-query" rows="2" placeholder="Your enquiry..."></textarea>
                <input type="text" id="form-teacher" placeholder="PE Teacher Name">
                <button class="submit-btn" onclick="submitForm()">Submit</button>
            `;
            msg.appendChild(form);
        }

        messagesDiv.appendChild(msg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showOptions(options) {
        optionsDiv.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => handleChoice(opt);
            optionsDiv.appendChild(btn);
        });
    }

    function handleChoice(choice) {
        addMessage(choice, 'user');
        setTimeout(() => {
            if (trainingData[choice]) {
                currentGroup = choice;
                addMessage(trainingData[choice].intro, 'bot');
                showOptions(["Show Program", "Back"]);
            } 
            else if (choice === "Show Program") {
                addMessage(trainingData[currentGroup].program, "bot");
                showOptions(["Yes, show videos", "Skip videos"]);
            }
            else if (choice === "Yes, show videos" || choice === "Skip videos") {
                if (choice === "Yes, show videos") addMessage("Watch these for form:", "bot", trainingData[currentGroup].videos);
                addMessage("Do you need additional help?", "bot");
                showOptions(["Yes, I have an enquiry", "No, I'm good"]);
            }
            else if (choice === "Yes, I have an enquiry") {
                addMessage("Please fill in the details:", "bot", [], true);
                optionsDiv.innerHTML = '';
            }
            else if (choice === "No, I'm good") {
                addMessage("Thank you! Good luck with your training!", "bot");
                showOptions(["Reset"]);
            }
            else if (choice === "Back" || choice === "Reset") { init(); }
        }, 500);
    }

    window.submitForm = function() {
        const data = {
            Name: document.getElementById('form-name').value,
            Class: document.getElementById('form-class').value,
            Enquiry: document.getElementById('form-query').value,
            Teacher: document.getElementById('form-teacher').value,
            Time: new Date().toLocaleString()
        };
        
        if(!data.Name || !data.Enquiry) return alert("Fill in Name and Enquiry!");
        submissions.push(data); // Save to session memory
        
        addMessage("Submitted! Your teacher will be notified.", "bot");
        setTimeout(() => { addMessage("Thank you!", "bot"); showOptions(["Reset"]); }, 800);
    };

    window.downloadData = function() {
        const pass = prompt("Enter Admin Password:");
        if (pass !== "PE2026") return alert("Incorrect Password");
        if (submissions.length === 0) return alert("No enquiries to download yet.");

        let csvContent = "data:text/csv;charset=utf-8,Time,Name,Class,Enquiry,Teacher\n" 
            + submissions.map(s => `"${s.Time}","${s.Name}","${s.Class}","${s.Enquiry}","${s.Teacher}"`).join("\n");

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "SBJ_Enquiries.csv");
        document.body.appendChild(link);
        link.click();
    };

    function init() {
        messagesDiv.innerHTML = '';
        addMessage("Welcome! Which group best describes your performance?", "bot");
        showOptions(["Beginners", "Developing", "Competent"]);
    }

    init();
</script>

</body>
</html>
